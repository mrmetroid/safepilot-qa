[project]
name = "safepilot-ci"
version = "0.1.0"
description = "Canary Swarm CI pipeline. Same entry point locally and in GitHub Actions."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    # The pipeline runs these from this project's venv, so they are runtime deps.
    "ruff==0.8.4",
    "pytest>=8",
]

[project.scripts]
safepilot-ci = "safepilot_ci.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safepilot_ci"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
