<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | Harbor Roast</title>
  <link rel="stylesheet" href="styles.css">
  <script src="store.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./">Harbor Roast</a>
    <nav><a href="cart.html" id="nav-cart">Cart <span class="cart-pill" id="cart-count">0</span></a></nav>
  </header>
  <main>
    <div class="panel" style="max-width:480px">
      <h2>Create your Harbor Roast account</h2>
      <p>Dummy demo form. Use fake details only.</p>
      <form id="signup-form" onsubmit="event.preventDefault(); localStorage.setItem('hr_user', document.getElementById('email').value || 'guest'); location.href='./?welcome=1'">
        <label for="name">Name</label><input type="text" id="name" name="name" placeholder="Ada Tester">
        <label for="email">Email</label><input type="email" id="email" name="email" placeholder="ada@example.test">
        <label for="password">Password</label><input type="password" id="password" name="password" placeholder="demo only">
        <div style="margin-top:16px; display:flex; gap:10px">
          <button class="btn" id="create-account" type="submit">Create account</button>
          <a class="btn secondary" id="continue-guest" href="./">Continue as guest</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
