[project]
name = "safepilot-qa"
version = "0.1.0"
description = "SafePilot QA control plane and developer CLI"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1",
    "openai>=1.50",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
safepilot = "app.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon and the safepilot-sandbox image"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
